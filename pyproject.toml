[project]
name = "gxp-document-migration"
version = "0.1.0"
description = "Step 20: validated document migration into a Vault-like DMS and archiving of a retired application"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.9",
    "python-dateutil>=2.9",
    "matplotlib>=3.9",
    "numpy>=2.1",
]

[dependency-groups]
dev = ["ruff>=0.8", "pytest>=8.3"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["req(id): the user requirement (URS) this test verifies"]
